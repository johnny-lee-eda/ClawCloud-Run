name   名字: ClawCloud 自动登录保活GET

on   :   在:
  schedule   时间表:   时间表:
    - cron: '0 1 */5 * *'  # UTC 1:00，每5天运行
  workflow_dispatch:

jobs   工作:   工作:
  auto-login   自动登录:   自动登录:
    runs-on   上运行:ubuntu-latest   运行在: ubuntu-latest
    timeout-minutes: 15
    
    steps   步骤:   步骤:
      - name   名字: 检出代码
        uses   使用: actions/checkout@v4

      - name   名字: 设置 Python
        uses   使用: actions/setup-python@v5
        with   :   与:
          python-version   python版本: '3.11'

      - name   名字: 安装依赖
        run   运行:|   运行: |
          pip install playwright requests pynaclPIP安装脚本请求pynacl
          playwright install chromium剧作家安装铬剧作家安装铬
          playwright install-deps   剧作家install-deps

      - name   名字: 运行自动登录
        env:
          GH_USERNAMEGH_USERNAME: ${{secrets。GH_USERNAME1}}: ${{ secrets.GH_USERNAME1 }}
          GH_PASSWORDGH_PASSWORD: ${{secrets。GH_PASSWORD1}}: ${{ secrets.GH_PASSWORD1 }}
          GH_SESSION: ${{ secrets.GH_SESSION }}GH_SESSION: ${{秘密。GH_SESSION}}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}TG_BOT_TOKEN: ${{secrets。TG_BOT_TOKEN}}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}TG_CHAT_ID: ${{secrets。TG_CHAT_ID}}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN1 }}REPO_TOKEN: ${{secrets。REPO_TOKEN1}}
          
        run   运行: python scripts/auto_login.py
        
      - name   名字: Keepalive Workflow
        run   运行:|   运行: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit --allow-empty -m "Chore: Keep-alive [skip ci]"
          git push || echo "No changes to push"
